{% extends 'base.html' %}

{% block title %}{{ page_title }} - Электронный журнал{% endblock %}

{% block content %}
    <title>Группы</title>
    <h2>{{ page_title }}</h2>
    <p><a href="{% url 'group_add' %}">Добавить новую группу</a></p>
    <ul>
        {% for groups in groups_list %}
            <li>
                <a href="{% url 'group_detail' group_id=groups.id %}">{{ groups }}</a>
            </li>
        {% empty %}
            <li>Список групп пуст.</li>
        {% endfor %}
    </ul>
{% endblock %}
