{% extends 'base.html' %}

{% block title %}Детали студенты: {{ student.name }}{% endblock %}

{% block content %}
    <h2>Студенты</h2>
    <p><strong>Название:</strong>  {{ student.name }}</p>
    <p><strong>ID:</strong>  {{ student.id }}</p>

    <p><a href="{% url 'student_edit' student_id=student.id %}">Редактировать студента</a></p>


    <a href="{% url 'students' %}">Назад к списку студентов</a>
{% endblock %}
